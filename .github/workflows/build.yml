name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Windows application
        run: npm run build
      - name: Verify isolated settings persistence
        shell: powershell
        run: ./tests/settings.ps1
      - name: Verify isolated install, upgrade and uninstall
        shell: powershell
        run: ./tests/installer.ps1
      - name: Package release
        shell: powershell
        run: ./scripts/package.ps1
      - name: Verify updater integrity, offline handling and rollback
        shell: powershell
        run: ./tests/updater.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Windows-x64
          path: |
            NEXUS-Windows-x64-v*.zip
            NEXUS-Windows-x64-v*.zip.sha256
          if-no-files-found: error
